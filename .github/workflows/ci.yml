name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      # The integration suite needs a real Postgres: it applies the drizzle
      # migrations and exercises submissions, delegates, magic links, and the
      # scheduler against actual rows. Trust auth with no password matches the
      # local dev server, so `npm run test:integration`'s hardcoded
      # DATABASE_URL works unchanged here.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # The suite refuses to run unless the database name ends in `itest` or
      # `_test`, and creates the database itself if it is missing.
      DATABASE_URL: postgres://postgres@localhost:5432/we_auto_league_itest
      AUTH_PROVIDER: session
      EMAIL_PROVIDER: console

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration

      # Reports known advisories without gating the build — a transitive
      # advisory in a dependency should be visible, not a merge blocker.
      - name: Audit production dependencies
        run: npm audit --omit=dev
        continue-on-error: true
